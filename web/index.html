<!-- schema.org Dataset, so Google Dataset Search and data catalogues list the open data (developers.google.com/search/docs/appearance/structured-data/dataset). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Naungan anticipatory cash programs",
  "description": "Every anticipatory humanitarian cash program on the Naungan contract (Base Sepolia testnet), rebuilt from the chain: hazard, location, forecast trigger, oracle reports, pool, donations, payouts and refunds. Payouts are aggregated and carry no household identity: families claim with zero-knowledge proofs.",
  "url": "https://naungan.vercel.app/",
  "sameAs": "https://github.com/PugarHuda/naungan",
  "keywords": ["anticipatory action", "humanitarian cash transfers", "forecast-based financing", "floods", "heatwaves", "GloFAS", "HXL", "IATI", "CAP"],
  "license": "https://opensource.org/license/mit",
  "isAccessibleForFree": true,
  "creator": { "@type": "Person", "name": "Pugar Huda Mantoro", "url": "https://github.com/PugarHuda" },
  "spatialCoverage": { "@type": "Place", "name": "Worldwide" },
  "distribution": [
    { "@type": "DataDownload", "name": "Programs (JSON)", "encodingFormat": "application/json", "contentUrl": "https://naungan.vercel.app/api/programs" },
    { "@type": "DataDownload", "name": "Programs, HXL-tagged CSV for HDX", "encodingFormat": "text/csv", "contentUrl": "https://naungan.vercel.app/programs.csv" },
    { "@type": "DataDownload", "name": "Programs (GeoJSON)", "encodingFormat": "application/geo+json", "contentUrl": "https://naungan.vercel.app/programs.geojson" },
    { "@type": "DataDownload", "name": "Triggers and funding (Atom)", "encodingFormat": "application/atom+xml", "contentUrl": "https://naungan.vercel.app/feed.xml" },
    { "@type": "DataDownload", "name": "Alerts (CAP 1.2)", "encodingFormat": "application/atom+xml", "contentUrl": "https://naungan.vercel.app/cap.xml" },
    { "@type": "DataDownload", "name": "Activities (IATI 2.03)", "encodingFormat": "application/xml", "contentUrl": "https://naungan.vercel.app/iati.xml" }
  ]
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
