# Hosted oracles: about every 6 hours (GloFAS and GEFS update daily), each key reports on every live program it is
# an oracle of, found on-chain (`oracle.js --all`), so a program launched from launch.html needs no setup
# here. Each oracle runs the pipeline its program's metadata assigns it (GloFAS, GEFS rainfall or heatwave).
# Setup: repository secrets ORACLE_KEY and, for 2-of-2 programs, RAIN_ORACLE_KEY (each with a little gas).
# A key running low on gas shows up as a warning on the run. Each run ends by asking the relayer to push
# "claims are open" to phones that opted in (POST /notify: idempotent, each phone is woken once).
name: Oracle
on:
  schedule: [{ cron: "17 * * * *" }] # hourly: GitHub delays and drops scheduled runs; --every keeps reports ~6-hourly
  workflow_dispatch:
    inputs:
      program: { description: "One program id (default: every live program of each key)", required: false }
concurrency: { group: oracle, cancel-in-progress: false } # never two reports racing on one nonce
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx hardhat compile
      # Flood/rain return levels come from 42 years of reanalysis and change once a year (lib/hazard.mjs memo):
      # keep them between runs so hourly runs don't spend Open-Meteo's free daily quota refetching them.
      - uses: actions/cache@v6
        with:
          path: .hazard-cache
          key: hazard-${{ github.run_id }}
          restore-keys: hazard-
      - name: Hosted oracle (GloFAS / heatwave)
        env:
          HAZARD_CACHE: .hazard-cache
          PRIVATE_KEY: ${{ secrets.ORACLE_KEY }}
          PROGRAM: ${{ inputs.program }}
        run: |
          if [ -n "$PROGRAM" ]; then node scripts/oracle.js --program "$PROGRAM"; else node scripts/oracle.js --all --every 5.5; fi
      - name: Second oracle (NOAA GEFS rainfall)
        if: ${{ inputs.program == '' }}
        env:
          HAZARD_CACHE: .hazard-cache
          PRIVATE_KEY: ${{ secrets.RAIN_ORACLE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "no RAIN_ORACLE_KEY secret: skipping"; exit 0; fi
          node scripts/oracle.js --all --every 5.5
      - name: Wake phones waiting on programs whose claims opened (Web Push)
        if: ${{ always() }}
        run: curl -fsS -X POST https://naungan.vercel.app/notify
