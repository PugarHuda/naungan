name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: python3 -m pip install --quiet lxml # validates CAP alerts against the OASIS schema in npm test
      - run: npm test
      - run: npm run check
      - run: npm run test:web
      - run: npm run build
  e2e:
    # The production build on vite preview, with vercel.json's security headers, against the live chain and data
    # services. Money endpoints (/relay, /transfer, /pin) are stubbed in every test, so nothing can be spent.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Static analysis gate: fail the build on any medium or high finding in Naungan.sol.
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts/Naungan.sol
          solc-version: 0.8.28
          slither-args: --filter-paths node_modules --exclude-dependencies --solc-remaps "@semaphore-protocol/=node_modules/@semaphore-protocol/ @openzeppelin/=node_modules/@openzeppelin/ @zk-kit/=node_modules/@zk-kit/ poseidon-solidity/=node_modules/poseidon-solidity/"
          fail-on: medium
